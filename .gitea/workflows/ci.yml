# Sovereign CI mirror — runs on the self-hosted Gitea act_runner
# (puretensor-act-runner on tensor-core, ubuntu-latest →
# docker://catthehacker/ubuntu:act-latest).
#
# Deliberately leaner than .github/workflows/ci.yml: one job covering the
# core gate (fmt, clippy -D warnings, full test suite). cargo-deny,
# actionlint, the schema check, and the dashboard python tests stay
# GitHub-side — this mirror exists so a GitHub outage (June 2026) cannot
# leave the repo with zero CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: install rust (stable, rustup)
        # rustup-init for the runner arch, checked against its published
        # .sha256 before it runs (never `curl | sh`).
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) triple=x86_64-unknown-linux-gnu ;;
            aarch64) triple=aarch64-unknown-linux-gnu ;;
            *) echo "::error::no rustup-init for $(uname -m)"; exit 1 ;;
          esac
          dir=$(mktemp -d)
          base="https://static.rust-lang.org/rustup/dist/${triple}"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$dir/rustup-init" "$base/rustup-init"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$dir/rustup-init.sha256" "$base/rustup-init.sha256"
          # The manifest reads "<sha256> *./rustup-init": check our download against that hash.
          echo "$(cut -d' ' -f1 "$dir/rustup-init.sha256")  $dir/rustup-init" | sha256sum -c --strict -
          chmod +x "$dir/rustup-init"
          "$dir/rustup-init" -y --profile minimal --default-toolchain 1.98.1 --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: version + lockfile coherence
        run: bash scripts/ci-version-check.sh

      - name: generated CLI artifacts
        run: bash scripts/generated-artifacts.sh --check

      - name: credential-safe failure alert tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: production feature wiring
        run: bash scripts/ci-production-build-check.sh

      - name: production binary build
        run: cargo build --release --bin pt --features native-ml --locked

      - name: native ML tests
        run: cargo test -p ptask-distill --features native-ml --locked

      - name: cargo test
        # PTASK_API_TOKEN must not leak in from the runner host — the
        # ptask-server auth tests require a hermetic env (see v1.13.0).
        run: env -u PTASK_API_TOKEN cargo test --workspace --locked
