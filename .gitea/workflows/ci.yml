# Sovereign CI mirror — runs on the self-hosted Gitea act_runner
# (puretensor-act-runner on tensor-core, ubuntu-latest →
# docker://catthehacker/ubuntu:act-latest).
#
# Deliberately leaner than .github/workflows/ci.yml: one job covering the
# core gate (fmt, clippy -D warnings, full test suite). cargo-deny,
# actionlint, the schema check, and the dashboard python tests stay
# GitHub-side — this mirror exists so a GitHub outage (June 2026) cannot
# leave the repo with zero CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust (stable, rustup)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: version + lockfile coherence
        run: bash scripts/ci-version-check.sh

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # PTASK_API_TOKEN must not leak in from the runner host — the
        # ptask-server auth tests require a hermetic env (see v1.13.0).
        run: env -u PTASK_API_TOKEN cargo test --workspace --locked
