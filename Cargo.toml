[workspace]
members = [
    "crates/ptask-core",
    "crates/ptask-cli",
    "crates/ptask-server",
    "crates/ptask-tui",
    "crates/ptask-bot",
    "crates/ptask-distill",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
authors = ["PureTensor, Inc. <hal@puretensor.ai>"]
repository = "https://github.com/puretensor/ptask"
homepage = "https://puretensor.ai"
rust-version = "1.90"

[workspace.dependencies]
# Workspace-wide pins. Crates opt in via { workspace = true }.
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
refinery = { version = "0.8", features = ["rusqlite"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
interim = { version = "0.2", features = ["jiff_0_2"] }
winnow = "1"
rrule = "0.14"
petgraph = "0.8"
ratatui = "0.30"
crossterm = "0.29"
nucleo = "0.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Internal crates
ptask-core   = { path = "crates/ptask-core",   version = "0.6.0" }
ptask-tui    = { path = "crates/ptask-tui",    version = "0.6.0" }
ptask-server = { path = "crates/ptask-server", version = "0.6.0" }
ptask-bot    = { path = "crates/ptask-bot",    version = "0.6.0" }

# HMAC for outbound webhook signing (v0.3.5).
sha2 = "0.10"
hmac = "0.12"
hex  = "0.4"

# Inbound email capture (v0.5.5).
mail-parser = "0.11"

# Telegram bot (v0.5.x). `macros` enables #[derive(BotCommands)].
# Schedules are jiff-based sleep-until loops (DST-correct) — no cron crate.
teloxide = { version = "0.17", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
