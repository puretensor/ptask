[workspace]
members = [
    "crates/ptask-core",
    "crates/ptask-cli",
    "crates/ptask-server",
    "crates/ptask-tui",
    "crates/ptask-bot",
    "crates/ptask-distill",
    "crates/ptask-notify",
]
resolver = "2"

[workspace.package]
version = "3.13.1"
edition = "2024"
license-file = "LICENSE"
authors = ["PureTensor, Inc. <hal@puretensor.ai>"]
repository = "https://github.com/puretensor/ptask"
homepage = "https://puretensor.ai"
rust-version = "1.90"

[workspace.dependencies]
# Workspace-wide pins. Crates opt in via { workspace = true }.
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
refinery = { version = "0.8", features = ["rusqlite"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
interim = { version = "0.2", features = ["jiff_0_2"] }
ratatui = "0.30"
crossterm = "0.29"
nucleo = "0.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }
base64 = "0.22"
rmcp = { version = "3.1.4", features = ["server", "macros", "schemars", "transport-streamable-http-server", "transport-streamable-http-server-session", "transport-io", "tower"] }
futures-util = { version = "0.3", default-features = false }

# Internal crates
ptask-core    = { path = "crates/ptask-core",    version = "3.13.1" }
ptask-tui     = { path = "crates/ptask-tui",     version = "3.13.1" }
ptask-server  = { path = "crates/ptask-server",  version = "3.13.1" }
ptask-bot     = { path = "crates/ptask-bot",     version = "3.13.1" }
ptask-distill = { path = "crates/ptask-distill", version = "3.13.1" }
ptask-notify  = { path = "crates/ptask-notify",  version = "3.13.1" }

# HMAC for outbound webhook signing (v0.3.5).
sha2 = "0.10"
hmac = "0.12"
hex  = "0.4"

# Inbound email capture (v0.5.5).
mail-parser = "0.11"

# Outbound SMTP for the accountability engine (v0.7.0).
lettre = { version = "0.11.22", default-features = false, features = ["smtp-transport", "rustls-tls", "tokio1-rustls-tls", "builder"] }

# Native ML stack (v0.8.2). candle = HF's pure-Rust deep-learning runtime;
# tokenizers = HF tokenizer; hf-hub for the on-disk cache lookup. Used by
# ptask-distill for sentence-transformers/all-MiniLM-L6-v2 embeddings.
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
