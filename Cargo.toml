[workspace]
members = [
    "crates/ptask-core",
    "crates/ptask-cli",
    "crates/ptask-server",
    "crates/ptask-tui",
    "crates/ptask-bot",
    "crates/ptask-distill",
]
resolver = "2"

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "MIT"
authors = ["PureTensor, Inc. <hal@puretensor.ai>"]
repository = "https://github.com/puretensor/ptask"
homepage = "https://puretensor.ai"
rust-version = "1.90"

[workspace.dependencies]
# Workspace-wide pins. Crates opt in via { workspace = true }.
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
refinery = { version = "0.8", features = ["rusqlite"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Internal crates
ptask-core = { path = "crates/ptask-core", version = "0.0.3" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
