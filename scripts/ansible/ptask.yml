---
# pTask fleet deploy.
#
# Installs the `pt` binary into ~/.cargo/bin/, drops the user-mode
# systemd units (serve / backup / distill / accountability / scoring), enables
# the canonical API service + timers, and verifies the binary version.
#
# Usage from the workstation — populate dist/ with the per-arch release
# artifacts first (the fleet is heterogeneous: mon3 is aarch64, mon2 has
# a glibc-2.35 floor; both are covered by the release.yml artifacts):
#
#   cd ~/ptask
#   # Fetch the per-arch artifacts from the Gitea release. GitHub Actions
#   # billing is blocked (PT-1215), so releases now publish to Gitea via
#   # .gitea/workflows/release.yml and `gh release download` no longer works.
#   GITEA=http://100.92.245.5:3002
#   TAG=vX.Y.Z
#   for a in pt-x86_64-unknown-linux-gnu pt-x86_64-unknown-linux-gnu.sha256 \
#            pt-aarch64-unknown-linux-gnu pt-aarch64-unknown-linux-gnu.sha256; do
#     curl -fsSL -o "dist/$a" "$GITEA/puretensor/ptask/releases/download/$TAG/$a"
#   done
#   # (or, with the tea CLI configured: cd dist && tea release download "$TAG" \
#   #  --repo puretensor/ptask)
#   ansible-playbook -i scripts/ansible/inventory.yml scripts/ansible/ptask.yml
#
# Each host receives the artifact matching its `ptask_arch_override`
# (inventory.yml): pt-aarch64-unknown-linux-gnu for aarch64 hosts,
# pt-x86_64-unknown-linux-gnu for everything else. NEVER push the
# controller-built target/release/pt to the whole fleet — that is how
# mon3 got an x86_64 binary (exec format error).
#
# Force one specific binary onto every host (single-arch escape hatch):
#
#   ansible-playbook ... -e ptask_binary=/path/to/pt
#
# Targets: tier-0 (mon, arx, fox-n, the canonical host). Spore tier excluded
# at the inventory level — these are GCP/Azure ephemeral nodes that
# don't host pt state.

- name: deploy pt to fleet
  hosts: ptask
  gather_facts: true
  become: false

  vars:
    ptask_dist_dir: "{{ playbook_dir }}/../../dist"
    # Per-host target triple, driven by `ptask_arch_override` in the
    # inventory. Matches the artifact names release.yml publishes.
    ptask_target_triple: >-
      {{ 'aarch64-unknown-linux-gnu'
         if (ptask_arch_override | default('')) == 'aarch64'
         else 'x86_64-unknown-linux-gnu' }}
    ptask_binary: "{{ ptask_dist_dir }}/pt-{{ ptask_target_triple }}"
    ptask_systemd_dir: "{{ ansible_env.HOME }}/.config/systemd/user"
    ptask_libexec_dir: "{{ ansible_env.HOME }}/.local/libexec"
    ptask_timer_units:
      - ptask-backup.service
      - ptask-backup.timer
      - ptask-distill.service
      - ptask-distill.timer
      - ptask-accountability.service
      - ptask-accountability.timer
      - ptask-scoring.service
      - ptask-scoring.timer
      - ptask-failure-alert@.service
      - ptask-restore-verify.service
      - ptask-restore-verify.timer
    ptask_service_units:
      - ptask-serve.service
    ptask_units: "{{ ptask_timer_units + ptask_service_units }}"
    # The canonical-store host owns `tasks.db`. Other tier-0 nodes will
    # eventually proxy through `pt serve` over Tailscale (v0.9.5). Until
    # that lands, only the canonical host runs the timers.
    ptask_is_canonical: "{{ inventory_hostname == ptask_canonical_host }}"

  pre_tasks:
    # Per host, NOT run_once — the artifact path differs by architecture,
    # so every host must verify its own binary exists on the controller.
    - name: verify controller-side binary exists for this host's arch
      delegate_to: localhost
      ansible.builtin.stat:
        path: "{{ ptask_binary }}"
      register: pt_local

    - name: fail if binary missing
      delegate_to: localhost
      ansible.builtin.fail:
        msg: |
          Binary not found at {{ ptask_binary }} (host {{ inventory_hostname }},
          triple {{ ptask_target_triple }}).
          Download the release artifacts first:
            gh release download vX.Y.Z --pattern 'pt-*' -D dist --clobber
          or cross-build:
            cargo build --release --bin pt --features native-ml --target {{ ptask_target_triple }} --locked
            cp target/{{ ptask_target_triple }}/release/pt dist/pt-{{ ptask_target_triple }}
      when: not pt_local.stat.exists

    # Belt-and-braces: refuse to copy a binary whose ELF architecture does
    # not match the target host. Catches a hand-copied wrong-arch file in
    # dist/ before it lands on a node.
    - name: verify binary ELF architecture matches host
      delegate_to: localhost
      ansible.builtin.shell: |
        set -o pipefail
        file -b "{{ ptask_binary }}" | grep -q "{{ 'aarch64' if ptask_target_triple.startswith('aarch64') else 'x86-64' }}"
      args:
        executable: /bin/bash
      changed_when: false

  tasks:
    - name: ensure ~/.cargo/bin exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.cargo/bin"
        state: directory
        mode: '0755'

    - name: copy pt binary
      ansible.builtin.copy:
        src: "{{ ptask_binary }}"
        dest: "{{ ansible_env.HOME }}/.cargo/bin/pt"
        mode: '0755'
        backup: true
      notify:
        - restart pt timers
        - restart ptask serve

    - name: query pt --version
      ansible.builtin.command: "{{ ansible_env.HOME }}/.cargo/bin/pt --version"
      register: pt_version_out
      changed_when: false

    - name: show version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} now runs {{ pt_version_out.stdout }}"

    - name: ensure user systemd dir exists
      ansible.builtin.file:
        path: "{{ ptask_systemd_dir }}"
        state: directory
        mode: '0755'

    - name: ensure user libexec dir exists
      ansible.builtin.file:
        path: "{{ ptask_libexec_dir }}"
        state: directory
        mode: '0755'

    - name: install credential-safe failure alert helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../ptask_failure_alert.py"
        dest: "{{ ptask_libexec_dir }}/ptask-failure-alert"
        mode: '0755'

    - name: install systemd units
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/{{ item }}"
        dest: "{{ ptask_systemd_dir }}/{{ item }}"
        mode: '0644'
      loop: "{{ ptask_units }}"
      notify:
        - daemon-reload
        - restart ptask serve

    - name: ensure linger enabled (timers must run when operator is logged out)
      ansible.builtin.command: "loginctl enable-linger {{ ansible_env.USER }}"
      register: linger_result
      changed_when: "'Linger=yes' not in linger_result.stdout"
      failed_when: false

    - name: flush handlers so daemon-reload runs before enable
      ansible.builtin.meta: flush_handlers

    - name: enable + start timers on canonical host
      ansible.builtin.systemd:
        name: "{{ item }}"
        scope: user
        enabled: true
        state: started
        daemon_reload: false
      loop:
        - ptask-backup.timer
        - ptask-distill.timer
        - ptask-accountability.timer
        - ptask-scoring.timer
        - ptask-restore-verify.timer
      when: ptask_is_canonical

    - name: enable + start API service on canonical host
      ansible.builtin.systemd:
        name: ptask-serve.service
        scope: user
        enabled: true
        state: started
        daemon_reload: false
      when: ptask_is_canonical

    - name: keep timers disabled on non-canonical hosts
      ansible.builtin.systemd:
        name: "{{ item }}"
        scope: user
        enabled: false
        state: stopped
      loop:
        - ptask-backup.timer
        - ptask-distill.timer
        - ptask-accountability.timer
        - ptask-scoring.timer
        - ptask-restore-verify.timer
      when: not ptask_is_canonical
      failed_when: false

    - name: keep API service disabled on non-canonical hosts
      ansible.builtin.systemd:
        name: ptask-serve.service
        scope: user
        enabled: false
        state: stopped
      when: not ptask_is_canonical
      failed_when: false

  handlers:
    - name: daemon-reload
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true

    - name: restart pt timers
      ansible.builtin.debug:
        msg: "binary updated; systemd handlers will re-pick on next fire (no service restart needed for oneshot timers)"

    - name: restart ptask serve
      ansible.builtin.systemd:
        name: ptask-serve.service
        scope: user
        state: restarted
      when: ptask_is_canonical
      failed_when: false
