---
# pTask fleet deploy.
#
# Installs the `pt` binary into ~/.cargo/bin/, drops the user-mode
# systemd units (serve / backup / distill / accountability / scoring), enables
# the canonical API service + timers, installs and enables Litestream WAL
# replication on the canonical host only, and verifies the binary version.
#
# Usage from the workstation. The playbook downloads nothing: it installs
# dist/pt-<triple> from the controller, so populate dist/ with the per-arch
# release artifacts first (the fleet is heterogeneous: mon3 is aarch64).
# Both forges' release workflows publish the same asset names, each with a
# .sha256 (the Gitea one only if the tag reached Gitea's workflow; see
# scripts/release.sh). The x86_64 binaries differ in glibc floor; fetch from
# either, and keep each binary with its own .sha256:
#
#   cd ~/ptask
#   TAG=vX.Y.Z
#   # GitHub Release (canonical; x86_64 built on tensor-core, glibc 2.39):
#   gh release download "$TAG" --repo puretensor/ptask --pattern 'pt-*' -D dist --clobber
#   # or the Gitea release (sovereign mirror; x86_64 built on ubuntu-22.04,
#   # glibc 2.35 floor: use it if any host is older than glibc 2.39):
#   GITEA=http://100.92.245.5:3002
#   for a in pt-x86_64-unknown-linux-gnu pt-x86_64-unknown-linux-gnu.sha256 \
#            pt-aarch64-unknown-linux-gnu pt-aarch64-unknown-linux-gnu.sha256; do
#     curl -fsSL -o "dist/$a" "$GITEA/puretensor/ptask/releases/download/$TAG/$a"
#   done
#   # (or, with the tea CLI configured: cd dist && tea release download "$TAG" \
#   #  --repo puretensor/ptask)
#   ansible-playbook -i scripts/ansible/inventory.yml scripts/ansible/ptask.yml
#
# Each host receives the artifact matching its `ptask_arch_override`
# (inventory.yml): pt-aarch64-unknown-linux-gnu for aarch64 hosts,
# pt-x86_64-unknown-linux-gnu for everything else. NEVER push the
# controller-built target/release/pt to the whole fleet — that is how
# mon3 got an x86_64 binary (exec format error).
#
# Force one specific binary onto every host (single-arch escape hatch; the
# play still requires /path/to/pt.sha256 beside it):
#
#   ansible-playbook ... -e ptask_binary=/path/to/pt
#
# Targets: tier-0 (mon, arx, fox-n, the canonical host). Spore tier excluded
# at the inventory level — these are GCP/Azure ephemeral nodes that
# don't host pt state.

- name: deploy pt to fleet
  hosts: ptask
  gather_facts: true
  become: false

  vars:
    ptask_dist_dir: "{{ playbook_dir }}/../../dist"
    # Per-host target triple, driven by `ptask_arch_override` in the
    # inventory. Matches the artifact names release.yml publishes.
    ptask_target_triple: >-
      {{ 'aarch64-unknown-linux-gnu'
         if (ptask_arch_override | default('')) == 'aarch64'
         else 'x86_64-unknown-linux-gnu' }}
    ptask_binary: "{{ ptask_dist_dir }}/pt-{{ ptask_target_triple }}"
    ptask_systemd_dir: "{{ ansible_env.HOME }}/.config/systemd/user"
    ptask_libexec_dir: "{{ ansible_env.HOME }}/.local/libexec"
    ptask_timer_units:
      - ptask-backup.service
      - ptask-backup.timer
      - ptask-distill.service
      - ptask-distill.timer
      - ptask-accountability.service
      - ptask-accountability.timer
      - ptask-scoring.service
      - ptask-scoring.timer
      - ptask-reaper.service
      - ptask-reaper.timer
      - ptask-export.service
      - ptask-export.timer
      - ptask-failure-alert@.service
      - ptask-restore-verify.service
      - ptask-restore-verify.timer
    ptask_service_units:
      - ptask-serve.service
    ptask_units: "{{ ptask_timer_units + ptask_service_units }}"
    # Installed and enabled on the canonical host only; clients hold no
    # tasks.db to replicate (docs/operations.md, Litestream WAL replication).
    ptask_canonical_units:
      - ptask-litestream.service
      - ptask-replica-check.service
      - ptask-replica-check.timer
    ptask_litestream_dir: "{{ ansible_env.HOME }}/.config/litestream"
    ptask_litestream_bin: /usr/local/bin/litestream
    # The canonical-store host owns `tasks.db`. Other tier-0 nodes will
    # eventually proxy through `pt serve` over Tailscale (v0.9.5). Until
    # that lands, only the canonical host runs the timers.
    ptask_is_canonical: "{{ inventory_hostname == ptask_canonical_host }}"
    # Litestream on the canonical host is the default; `-e ptask_litestream=false`
    # keeps it rolled back (docs/operations.md, Litestream > Rollback): the
    # play then disables it and removes the PTASK_WAL_AUTOCHECKPOINT=0 it seeded.
    ptask_run_litestream: "{{ ptask_is_canonical and (ptask_litestream | default(true) | bool) }}"
    ptask_dotenv: "{{ ansible_env.HOME }}/puretensor-tasks/.env"

  pre_tasks:
    # Per host, NOT run_once — the artifact path differs by architecture,
    # so every host must verify its own binary exists on the controller.
    - name: verify controller-side binary exists for this host's arch
      delegate_to: localhost
      ansible.builtin.stat:
        path: "{{ ptask_binary }}"
      register: pt_local

    - name: fail if binary missing
      delegate_to: localhost
      ansible.builtin.fail:
        msg: |
          Binary not found at {{ ptask_binary }} (host {{ inventory_hostname }},
          triple {{ ptask_target_triple }}).
          Download the release artifacts first (GitHub, or the Gitea mirror
          as shown in this playbook's header):
            gh release download vX.Y.Z --repo puretensor/ptask --pattern 'pt-*' -D dist --clobber
          or cross-build:
            cargo build --release --bin pt --features native-ml --target {{ ptask_target_triple }} --locked
            cp target/{{ ptask_target_triple }}/release/pt dist/pt-{{ ptask_target_triple }}
            (cd dist && sha256sum pt-{{ ptask_target_triple }} > pt-{{ ptask_target_triple }}.sha256)
      when: not pt_local.stat.exists

    # Integrity before anything leaves the controller: every release asset
    # has a pt-<triple>.sha256 beside it. The manifest must name exactly this
    # file (sha256sum -c checks whatever path a manifest lists), then
    # sha256sum -c must pass. A missing manifest or a mismatch fails the play.
    - name: verify binary against its published .sha256
      delegate_to: localhost
      ansible.builtin.shell: |
        set -euo pipefail
        cd "$(dirname "{{ ptask_binary }}")"
        bin="$(basename "{{ ptask_binary }}")"
        if [ ! -f "$bin.sha256" ]; then
          echo "missing $bin.sha256 beside $bin: fetch it with the binary" >&2
          exit 1
        fi
        awk -v f="$bin" '$2 != f && $2 != "*" f { bad = 1 } END { exit bad || NR != 1 }' "$bin.sha256" \
          || { echo "$bin.sha256 must be one line naming $bin" >&2; exit 1; }
        sha256sum -c --strict "$bin.sha256"
      args:
        executable: /bin/bash
      changed_when: false

    # Belt-and-braces: refuse to copy a binary whose ELF architecture does
    # not match the target host. Catches a hand-copied wrong-arch file in
    # dist/ before it lands on a node.
    - name: verify binary ELF architecture matches host
      delegate_to: localhost
      ansible.builtin.shell: |
        set -o pipefail
        file -b "{{ ptask_binary }}" | grep -q "{{ 'aarch64' if ptask_target_triple.startswith('aarch64') else 'x86-64' }}"
      args:
        executable: /bin/bash
      changed_when: false

  tasks:
    - name: ensure ~/.cargo/bin exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.cargo/bin"
        state: directory
        mode: '0755'

    - name: copy pt binary
      ansible.builtin.copy:
        src: "{{ ptask_binary }}"
        dest: "{{ ansible_env.HOME }}/.cargo/bin/pt"
        mode: '0755'
        backup: true
      notify:
        - restart pt timers
        - restart ptask serve

    - name: query pt --version
      ansible.builtin.command: "{{ ansible_env.HOME }}/.cargo/bin/pt --version"
      register: pt_version_out
      changed_when: false

    - name: show version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} now runs {{ pt_version_out.stdout }}"

    - name: ensure user systemd dir exists
      ansible.builtin.file:
        path: "{{ ptask_systemd_dir }}"
        state: directory
        mode: '0755'

    - name: ensure user libexec dir exists
      ansible.builtin.file:
        path: "{{ ptask_libexec_dir }}"
        state: directory
        mode: '0755'

    - name: install credential-safe failure alert helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../ptask_failure_alert.py"
        dest: "{{ ptask_libexec_dir }}/ptask-failure-alert"
        mode: '0755'

    - name: install systemd units
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/{{ item }}"
        dest: "{{ ptask_systemd_dir }}/{{ item }}"
        mode: '0644'
      loop: "{{ ptask_units }}"
      notify:
        - daemon-reload
        - restart ptask serve

    # ---- Litestream: canonical host only --------------------------------
    - name: check litestream binary on canonical host
      ansible.builtin.stat:
        path: "{{ ptask_litestream_bin }}"
      register: litestream_bin
      when: ptask_run_litestream

    - name: fail if litestream is not installed on canonical host
      ansible.builtin.fail:
        msg: |
          {{ ptask_litestream_bin }} is missing on {{ inventory_hostname }}.
          Install it first (docs/operations.md, Litestream > Pre-requisites);
          the unit would otherwise crash-loop into failed.
      when: ptask_run_litestream and not litestream_bin.stat.exists

    - name: ensure litestream config dir exists on canonical host
      ansible.builtin.file:
        path: "{{ ptask_litestream_dir }}"
        state: directory
        mode: '0700'
      when: ptask_run_litestream

    # The repo file is an example ("edit paths"): install it on first deploy
    # only, never over an operator's edited copy or the documented symlink.
    - name: install litestream config on canonical host (first deploy only)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../litestream/litestream.yml"
        dest: "{{ ptask_litestream_dir }}/litestream.yml"
        mode: '0644'
        force: false
      notify: restart ptask litestream
      when: ptask_run_litestream

    # The unit reads this file if present (EnvironmentFile=-). The CephFS
    # replica needs no settings, so an empty 0600 file is valid; existing
    # contents (S3 credentials) are never touched.
    - name: ensure litestream env file exists on canonical host
      ansible.builtin.file:
        path: "{{ ptask_litestream_dir }}/.env"
        state: touch
        mode: '0600'
        access_time: preserve
        modification_time: preserve
      when: ptask_run_litestream

    - name: install canonical-only systemd units
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/{{ item }}"
        dest: "{{ ptask_systemd_dir }}/{{ item }}"
        mode: '0644'
      loop: "{{ ptask_canonical_units }}"
      notify:
        - daemon-reload
        - restart ptask litestream
      when: ptask_run_litestream

    # pt reads PTASK_WAL_AUTOCHECKPOINT from ~/puretensor-tasks/.env; =0 leaves
    # checkpointing to Litestream for every .env-loading pt process. Seed it
    # only when the key is absent: an operator's own value is never changed.
    - name: check the canonical host's .env
      ansible.builtin.stat:
        path: "{{ ptask_dotenv }}"
      register: ptask_dotenv_stat
      when: ptask_is_canonical

    - name: fail if the canonical host has no .env
      ansible.builtin.fail:
        msg: |
          {{ ptask_dotenv }} is missing on {{ inventory_hostname }}; ptask-serve
          and the timers cannot start without it (PTASK_API_TOKEN, bind address).
      when: ptask_is_canonical and not ptask_dotenv_stat.stat.exists

    - name: look for PTASK_WAL_AUTOCHECKPOINT in .env
      ansible.builtin.command: "grep -c '^PTASK_WAL_AUTOCHECKPOINT=' {{ ptask_dotenv }}"
      register: ptask_walcp
      changed_when: false
      failed_when: ptask_walcp.rc > 1
      when: ptask_run_litestream

    - name: seed PTASK_WAL_AUTOCHECKPOINT=0 when .env does not set it
      ansible.builtin.lineinfile:
        path: "{{ ptask_dotenv }}"
        line: PTASK_WAL_AUTOCHECKPOINT=0
        insertafter: EOF
        create: false
      notify: restart ptask serve
      when: ptask_run_litestream and ptask_walcp.rc == 1

    # Rolled back (-e ptask_litestream=false): nothing checkpoints for pt, so
    # drop the value this play seeds (other values are the operator's).
    - name: remove PTASK_WAL_AUTOCHECKPOINT=0 when Litestream is rolled back
      ansible.builtin.lineinfile:
        path: "{{ ptask_dotenv }}"
        regexp: '^PTASK_WAL_AUTOCHECKPOINT=0$'
        state: absent
      notify: restart ptask serve
      when: ptask_is_canonical and not ptask_run_litestream

    - name: ensure linger enabled (timers must run when operator is logged out)
      ansible.builtin.command: "loginctl enable-linger {{ ansible_env.USER }}"
      register: linger_result
      changed_when: "'Linger=yes' not in linger_result.stdout"
      failed_when: false

    - name: flush handlers so daemon-reload runs before enable
      ansible.builtin.meta: flush_handlers

    # Replication first, then the writers (timers, API). The daily replica
    # check proves the replication is still landing.
    - name: enable + start litestream and its daily check on canonical host
      ansible.builtin.systemd:
        name: "{{ item }}"
        scope: user
        enabled: true
        state: started
        daemon_reload: false
      loop:
        - ptask-litestream.service
        - ptask-replica-check.timer
      when: ptask_run_litestream

    - name: enable + start timers on canonical host
      ansible.builtin.systemd:
        name: "{{ item }}"
        scope: user
        enabled: true
        state: started
        daemon_reload: false
      loop:
        - ptask-backup.timer
        - ptask-distill.timer
        - ptask-accountability.timer
        - ptask-scoring.timer
        - ptask-reaper.timer
        - ptask-export.timer
        - ptask-restore-verify.timer
      when: ptask_is_canonical

    - name: enable + start API service on canonical host
      ansible.builtin.systemd:
        name: ptask-serve.service
        scope: user
        enabled: true
        state: started
        daemon_reload: false
      when: ptask_is_canonical

    - name: keep timers disabled on non-canonical hosts
      ansible.builtin.systemd:
        name: "{{ item }}"
        scope: user
        enabled: false
        state: stopped
      loop:
        - ptask-backup.timer
        - ptask-distill.timer
        - ptask-accountability.timer
        - ptask-scoring.timer
        - ptask-reaper.timer
        - ptask-export.timer
        - ptask-restore-verify.timer
      when: not ptask_is_canonical
      failed_when: false

    - name: keep API service disabled on non-canonical hosts
      ansible.builtin.systemd:
        name: ptask-serve.service
        scope: user
        enabled: false
        state: stopped
      when: not ptask_is_canonical
      failed_when: false

    - name: keep litestream and its check disabled (clients, or rolled back)
      ansible.builtin.systemd:
        name: "{{ item }}"
        scope: user
        enabled: false
        state: stopped
      loop:
        - ptask-litestream.service
        - ptask-replica-check.timer
      when: not ptask_run_litestream
      failed_when: false

  handlers:
    - name: daemon-reload
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true

    - name: restart pt timers
      ansible.builtin.debug:
        msg: "binary updated; systemd handlers will re-pick on next fire (no service restart needed for oneshot timers)"

    - name: restart ptask serve
      ansible.builtin.systemd:
        name: ptask-serve.service
        scope: user
        state: restarted
      when: ptask_is_canonical

    - name: restart ptask litestream
      ansible.builtin.systemd:
        name: ptask-litestream.service
        scope: user
        state: restarted
      when: ptask_run_litestream
