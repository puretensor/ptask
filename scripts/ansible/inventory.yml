---
# Example pTask deploy inventory. Copy and replace hostnames with your own.
#
# Canonical host owns tasks.db and runs serve/backup/distill timers.
# Client hosts install the binary, keep timers disabled, and proxy via
# `pt remote` (PTASK_SYNC_URL).

all:
  vars:
    ansible_user: root
    ptask_canonical_host: ptask-canonical
    ptask_serve_url: http://ptask.example:9501

  children:
    ptask:
      children:
        ptask_canonical:
          hosts:
            ptask-canonical:
              ansible_host: ptask.example
              ansible_user: ptask

        ptask_tier0:
          hosts:
            ptask-client-a:
              ansible_host: client-a.example
            ptask-client-b:
              ansible_host: client-b.example
              # Older glibc example — build inside ubuntu:22.04
              ptask_arch_override: x86_64-ubuntu22
            ptask-client-arm:
              ansible_host: client-arm.example
              ptask_arch_override: aarch64
