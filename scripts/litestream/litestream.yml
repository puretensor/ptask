# Example Litestream config for the canonical pTask host.
#
# Copy to ~/.config/litestream/litestream.yml and edit paths.
# The pTask DB should open with journal_mode=WAL and wal_autocheckpoint=0
# so Litestream owns the checkpoint cadence.
#
# RPO target: under one minute.

dbs:
  - path: /home/ptask/puretensor-tasks/tasks.db

    checkpoint-interval: 1m
    min-checkpoint-page-count: 1000
    max-checkpoint-page-count: 50000

    replicas:
      - name: local-fs
        path: /var/backups/ptask-litestream/tasks.db
        snapshot-interval: 24h
        retention: 720h
        retention-check-interval: 1h

      # Optional S3-compatible replica:
      # - name: object-store
      #   type: s3
      #   endpoint: ${PTASK_LITESTREAM_ENDPOINT}
      #   bucket: ${PTASK_LITESTREAM_BUCKET}
