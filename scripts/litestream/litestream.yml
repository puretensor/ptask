# pTask Litestream replication config — mon1 canonical only.
#
# Drop into ~/.config/litestream/litestream.yml (operator HOME, root for
# system-mode if you prefer system services). Sub %s with operator's
# Ceph rados-gateway endpoint + credentials before running.
#
# The pTask DB at ~/puretensor-tasks/tasks.db opens with
# journal_mode=WAL and wal_autocheckpoint=0 — Litestream owns the
# checkpoint cadence. Don't run `sqlite3 ... 'PRAGMA wal_checkpoint(...)'`
# while replication is active.
#
# RPO target: < 1 minute. Litestream defaults are aligned to that.

dbs:
  - path: /home/puretensorai/puretensor-tasks/tasks.db

    # SQLite tunings Litestream needs / enforces.
    checkpoint-interval: 1m         # Periodic checkpoint so the WAL doesn't grow unbounded.
    min-checkpoint-page-count: 1000 # Don't bother before 1k pages of WAL accumulate.
    max-checkpoint-page-count: 50000

    replicas:
      - name: ceph
        type: s3

        # Ceph rados gateway. Set to the cluster endpoint, e.g.
        # https://ceph-rgw.ts.puretensor.local
        endpoint: ${PTASK_LITESTREAM_ENDPOINT}

        # Bucket + prefix.
        bucket: ${PTASK_LITESTREAM_BUCKET}
        path: ptask/mon1/tasks.db

        # Region is required by aws-sdk; Ceph ignores the value.
        region: us-east-1
        force-path-style: true

        # Snapshot + retention.
        # One snapshot per 24h, retain 30 days. WAL segments roll over every
        # 30s by default — covers the < 1 min RPO target.
        snapshot-interval: 24h
        retention: 720h        # 30 days
        retention-check-interval: 1h
