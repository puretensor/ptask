[package]
name = "ptask-core"
description = "Core domain logic for pTask: storage, parsing, scoring, accountability"
version.workspace = true
publish = false
edition.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
# float_roundtrip: approval payload digests need the correctly rounded f64
# (the default fast path can be one ulp off for 17-digit literals).
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
refinery = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
interim = { workspace = true }
# Deliberately NO reqwest/lettre/tokio: the domain crate is pure. Network
# dispatch implementations live in ptask-notify behind the Dispatch trait.

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
