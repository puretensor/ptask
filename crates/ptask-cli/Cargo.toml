[package]
name = "ptask-cli"
description = "pt — the pTask command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "pt"
path = "src/main.rs"

[dependencies]
ptask-core    = { workspace = true }
ptask-tui     = { workspace = true }
ptask-server  = { workspace = true }
ptask-bot     = { workspace = true }
ptask-distill = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

# Remote client (v0.9.5).
reqwest = { workspace = true, features = ["json", "rustls-tls", "blocking"], default-features = false }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
