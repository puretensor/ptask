[package]
name = "ptask-cli"
description = "pt — the pTask command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "pt"
path = "src/main.rs"

[dependencies]
ptask-core    = { workspace = true }
ptask-tui     = { workspace = true }
ptask-server  = { workspace = true }
ptask-bot     = { workspace = true }
ptask-distill = { workspace = true }
ptask-notify  = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = "0.3"
tokio = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

# Remote client (v0.9.5).
reqwest = { workspace = true, features = ["json", "rustls-tls", "blocking"], default-features = false }
uuid = { workspace = true }

[features]
default = []
# Build the candle-backed native ML pipeline into `pt`. Off by default for
# dev builds (the candle stack nearly doubles the dependency tree). The
# PRODUCTION binary is built WITH this feature as of v2.5.0: it powers
# semantic dedup in both the distill pipeline and the capture fast lane.
native-ml = ["ptask-distill/native-ml", "ptask-server/semantic-dedup"]

[dev-dependencies]
axum = { workspace = true }
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "pt_bench"
harness = false
