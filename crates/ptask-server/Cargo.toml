[package]
name = "ptask-server"
description = "pTask HTTP server — sync API, capture endpoint, outbound webhooks, Prometheus metrics."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ptask-core = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
base64 = { workspace = true }
rmcp = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
jiff = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex  = { workspace = true }
rusqlite = { workspace = true }
mail-parser = { workspace = true }
uuid = { workspace = true }

# Semantic dedup for the capture fast lane (v2.5.0). Optional: pulls the
# candle embedding stack via ptask-distill's native-ml feature. Without it
# the fast lane still dedups on exact capture_key; semantic matching is a
# no-op that fails open.
ptask-distill = { workspace = true, optional = true }

[features]
semantic-dedup = ["dep:ptask-distill", "ptask-distill/native-ml"]

[dev-dependencies]
tempfile = "3"
tower = "0.5"
