[package]
name = "ptask-distill"
description = "pTask distillation orchestrator. v0.6.x shims Python; v0.9.0 ports to Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ptask-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Native ML (v0.8.2) — feature-gated since the native pipeline has never
# driven production (`pt distill` runs the Python shim; the HAL endpoints
# the native path needs were never stood up). Enable with `--features
# native-ml` (or via ptask-cli's forwarding feature) to build the candle
# embedding stack: ~170 extra crates and the largest share of compile time.
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }

# Temporal dedup hashing (v0.8.5).
sha2 = { workspace = true }
hex = { workspace = true }
rusqlite = { workspace = true }
jiff = { workspace = true }

[features]
default = []
native-ml = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]

[[example]]
name = "sbert_bench"
required-features = ["native-ml"]

[[example]]
name = "sbert_parity"
required-features = ["native-ml"]

[[example]]
name = "cluster_probe"
required-features = ["native-ml"]

[dev-dependencies]
axum = { workspace = true }
tempfile = "3"
jiff = { workspace = true }
