name: release

# Fires when an operator pushes a `vX.Y.Z` tag. Builds the `pt` binary
# for x86_64-unknown-linux-gnu, generates a SHA-256 manifest, and
# attaches both to the GitHub Release.
#
# Musl static-binary target deferred: candle + tokenizers + onig need
# musl-clean build env validation that lives on the workstation, not in
# CI. Once `cargo build --target x86_64-unknown-linux-musl --release`
# succeeds locally, swap the target below and drop `RUSTFLAGS`.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build x86_64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-gnu

      - name: cargo build --release
        run: cargo build --release --bin pt
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"

      - name: strip + checksum
        run: |
          strip target/release/pt
          mkdir -p dist
          mv target/release/pt dist/pt-x86_64-unknown-linux-gnu
          cd dist
          sha256sum pt-x86_64-unknown-linux-gnu > pt-x86_64-unknown-linux-gnu.sha256

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pt-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error

  release:
    name: github release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: extract changelog tail
        id: notes
        run: |
          {
            echo "notes<<NOTES_EOF"
            git log --oneline "$(git describe --tags --abbrev=0 --exclude='${{ github.ref_name }}' 2>/dev/null || git rev-list --max-parents=0 HEAD)..${{ github.ref_name }}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## pTask ${{ github.ref_name }}

            Single-binary release. Linux x86_64 (glibc, x86-64-v3 baseline).

            ### Verifying
            ```
            sha256sum -c pt-x86_64-unknown-linux-gnu.sha256
            ```

            ### Install
            ```
            curl -L -o pt https://github.com/puretensor/ptask/releases/download/${{ github.ref_name }}/pt-x86_64-unknown-linux-gnu
            chmod +x pt && sudo mv pt /usr/local/bin/
            pt --version
            ```

            ### Commits since previous tag
            ```
            ${{ steps.notes.outputs.notes }}
            ```
          files: dist/*
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
