name: release

# Fires when an operator pushes a `vX.Y.Z` tag. Builds the `pt` binary
# for x86_64-unknown-linux-gnu AND aarch64-unknown-linux-gnu (mon3),
# generates SHA-256 manifests, and attaches everything to the GitHub
# Release. Built on ubuntu-22.04 so the glibc floor (2.35) covers mon2.
#
# Musl static-binary target deferred: candle + tokenizers + onig need
# musl-clean build env validation that lives on the workstation, not in
# CI. Once `cargo build --release --bin pt --features native-ml --target
# x86_64-unknown-linux-musl --locked`
# succeeds locally, add the target to the matrix.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: [self-hosted, tensor-core]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            rustflags: "-C target-cpu=x86-64-v3"
            strip: strip
          - target: aarch64-unknown-linux-gnu
            # mon3 (arm64): no target-cpu narrowing.
            rustflags: ""
            strip: aarch64-linux-gnu-strip
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: release-${{ matrix.target }}

      - name: verify version and lockfile coherence
        run: bash scripts/ci-version-check.sh
        env:
          PTASK_RELEASE_TAG: ${{ github.ref_name }}

      - name: cargo build --release
        run: cargo build --release --bin pt --features native-ml --target ${{ matrix.target }} --locked
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++

      - name: strip + checksum
        run: |
          ${{ matrix.strip }} target/${{ matrix.target }}/release/pt
          mkdir -p dist
          mv target/${{ matrix.target }}/release/pt dist/pt-${{ matrix.target }}
          cd dist
          sha256sum pt-${{ matrix.target }} > pt-${{ matrix.target }}.sha256

      - name: upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: github release
    needs: build
    runs-on: [self-hosted, tensor-core]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: extract changelog tail
        id: notes
        run: |
          {
            echo "notes<<NOTES_EOF"
            git log --oneline "$(git describe --tags --abbrev=0 --exclude='${{ github.ref_name }}' 2>/dev/null || git rev-list --max-parents=0 HEAD)..${{ github.ref_name }}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## pTask ${{ github.ref_name }}

            Single-binary release.
            - `pt-x86_64-unknown-linux-gnu` — Linux x86_64 (glibc ≥ 2.35, x86-64-v3 baseline)
            - `pt-aarch64-unknown-linux-gnu` — Linux arm64 (mon3)

            ### Verifying
            ```
            sha256sum -c pt-<target>.sha256
            ```

            ### Install
            ```
            curl -L -o pt https://github.com/puretensor/ptask/releases/download/${{ github.ref_name }}/pt-$(uname -m)-unknown-linux-gnu
            chmod +x pt && sudo mv pt /usr/local/bin/
            pt --version
            ```

            ### Commits since previous tag
            ```
            ${{ steps.notes.outputs.notes }}
            ```
          files: dist/*
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
