name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  actionlint:
    name: actionlint
    runs-on: [self-hosted, tensor-core]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_LINUX_AMD64_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/actionlint "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: actionlint

  fmt:
    name: rustfmt
    runs-on: [self-hosted, tensor-core]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: [self-hosted, tensor-core]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The feature-gated native ML stack still has to stay lint-clean.
      - run: cargo clippy -p ptask-distill --all-targets --features native-ml -- -D warnings

  test:
    name: test
    runs-on: [self-hosted, tensor-core]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: bash scripts/ci-version-check.sh
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: cargo build --workspace --locked
      - run: bash scripts/ci-production-build-check.sh
      - run: cargo build --release --bin pt --features native-ml --locked
      - run: cargo test --workspace --locked
      # The feature-gated native ML stack still has to pass its tests.
      - run: cargo test -p ptask-distill --features native-ml --locked

  dashboard-test:
    name: dashboard python tests
    runs-on: [self-hosted, tensor-core]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s tests -v
        working-directory: dashboard

  security:
    name: dependency policy check
    runs-on: [self-hosted, tensor-core]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: install cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked
      - run: cargo deny check advisories licenses sources

  schema-check:
    name: schema sanity
    runs-on: [self-hosted, tensor-core]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Verify migrations create expected tables
        run: bash scripts/ci-schema-check.sh
