name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# CI runs on GitHub-hosted runners (ubuntu-latest), which are free for public repositories
# (PT-2844, 2026-11-13). A pull request's code, a fork's included, therefore never runs on
# tensor-core, the production host. Only release.yml uses the self-hosted runner, and it runs
# on v* tag pushes, which forks cannot make. Fork pull requests still need a maintainer's
# approval to run (Settings -> Actions -> General: Require approval for all external
# contributors; docs/operations.md, "CI runners").

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # actionlint, rustfmt, the dependency policy and clippy share one job.
  lint:
    name: lint (actionlint, rustfmt, cargo-deny, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_LINUX_AMD64_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/actionlint "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: actionlint
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: install cargo-deny
        run: |
          cargo deny --version 2>/dev/null | grep -q '0\.19\.9' \
            || cargo install cargo-deny --version 0.19.9 --locked
      - run: cargo deny check advisories licenses sources
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-bin: "false"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The feature-gated native ML stack still has to stay lint-clean.
      - run: cargo clippy -p ptask-distill --all-targets --features native-ml -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-bin: "false"
      - run: bash scripts/ci-version-check.sh
      - run: bash scripts/generated-artifacts.sh --check
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: cargo build --workspace --locked
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: install pytest
        run: python -m pip install pytest==9.0.3
      - name: approvals and goals contracts
        run: PT_BIN=target/debug/pt python -m pytest tests/test_11_approvals_contract.py tests/test_12_goals_contract.py -q
      - run: bash scripts/ci-production-build-check.sh
      - run: cargo build --release --bin pt --features native-ml --locked
      - run: cargo test --workspace --locked
      # The feature-gated native ML stack still has to pass its tests.
      - run: cargo test -p ptask-distill --features native-ml --locked

  dashboard-test:
    name: dashboard python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s tests -v
        working-directory: dashboard
      - name: open-access + markup contract tests
        run: node --test tests/domains_markup.test.mjs tests/open_access.test.mjs tests/notes_markup.test.mjs tests/review_pr122_drawer.test.mjs tests/flux_markup.test.mjs tests/review_pr125.test.mjs tests/criteria_markup.test.mjs tests/review_pr127_drawer.test.mjs tests/phone_layout.test.mjs tests/wordmark.test.mjs
        working-directory: dashboard

  schema-check:
    name: schema sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-bin: "false"
      - name: Verify migrations create expected tables
        run: bash scripts/ci-schema-check.sh
