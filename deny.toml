# cargo-deny policy for CI supply-chain checks.

# Check the graph production actually ships. Release builds use
# `--features native-ml`; with default features the ML-only crates (candle,
# tokenizers, hf-hub, ureq, zip, onig_sys, safetensors, gemm, ...) were never
# checked for advisories, licenses, or sources.
[graph]
all-features = true

[advisories]
# Accepted notices, all reachable only through the native-ml feature, none
# with an upgrade path today. Revisit when candle/tokenizers/hf-hub move on.
ignore = [
    # paste 1.0.15: proc-macro crate, archived by its author. Pulled in by
    # gemm/candle-core, pulp, macro_rules_attribute and tokenizers; it runs
    # only at compile time and generates identifiers.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro via candle/tokenizers; no alternative upstream" },
    # number_prefix 0.4.0: formats byte counts for indicatif 0.17, which
    # hf-hub 0.4.3 pins. Pure formatting, no I/O or unsafe surface we feed.
    { id = "RUSTSEC-2025-0119", reason = "unmaintained formatting helper via hf-hub -> indicatif 0.17; hf-hub pins it" },
    # zip 7.2.0 extraction flaws (published 2026-10): SUID/SGID bits kept,
    # symlink targets and permissions applied outside the destination. All
    # three are in ZipArchive::extract / ZipStreamReader::extract. Our only
    # zip user is candle-core 0.10.2, which opens archives and reads entries
    # by name (pickle.rs, npy.rs) or writes .npz, and never extracts. The fix
    # is zip >= 9.0; candle-core 0.11.0 still pins zip ^8.6.
    { id = "RUSTSEC-2026-0367", reason = "zip extract() keeps SUID/SGID; candle-core never extracts; no candle release on zip 9" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract() symlink escape; candle-core never extracts; no candle release on zip 9" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract() permissions via symlinks; candle-core never extracts; no candle release on zip 9" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# Workspace crates use `license-file = "LICENSE"` (no SPDX expression).
private = { ignore = true }
