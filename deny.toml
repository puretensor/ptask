# cargo-deny policy for CI supply-chain checks.

# Check the graph production actually ships. Release builds use
# `--features native-ml`; with default features the ML-only crates (candle,
# tokenizers, hf-hub, ureq, zip, onig_sys, safetensors, gemm, ...) were never
# checked for advisories, licenses, or sources.
[graph]
all-features = true

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# Workspace crates use `license-file = "LICENSE"` (no SPDX expression).
private = { ignore = true }
